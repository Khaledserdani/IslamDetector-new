name: Build IslamDetector v0.0 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "IslamDetector-v0.0.zip"
      - ".github/workflows/build-v0.0.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q IslamDetector-v0.0.zip -d build-project
          test -f build-project/settings.gradle.kts
          test -f build-project/app/build.gradle.kts

      - name: Build debug APK
        working-directory: build-project
        run: gradle --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p apk-output
          cp build-project/app/build/outputs/apk/debug/app-debug.apk apk-output/IslamDetector-v0.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IslamDetector-v0.0-APK
          path: apk-output/IslamDetector-v0.0-debug.apk
          if-no-files-found: error
