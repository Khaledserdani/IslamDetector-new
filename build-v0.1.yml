name: .github/workflows/build-v0.1.yml


on:
  workflow_dispatch:
  push:
    paths:
      - 'IslamDetector-v0.1-project.zip'
      - '.github/workflows/build-v0.1.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract v0.1 project
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q IslamDetector-v0.1-project.zip -d build-project
          test -f build-project/settings.gradle.kts
          test -f build-project/app/build.gradle.kts

      - name: Build debug APK
        working-directory: build-project
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p apk-output
          cp build-project/app/build/outputs/apk/debug/app-debug.apk apk-output/IslamDetector-v0.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IslamDetector-v0.1-APK
          path: apk-output/IslamDetector-v0.1-debug.apk
          if-no-files-found: error
